<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="'Yu Gothic','Hiragino Sans','Zen Kaku Gothic New',sans-serif"><rect width="760" height="560" fill="#f4f5f7"/><text x="380" y="30" font-size="18" fill="#1b2129" text-anchor="middle" font-weight="bold">案 C 天職: 一章の最後に選び、三章で 2 つ目</text><rect x="30" y="60" width="220" height="40" rx="8" fill="#6c7a89" stroke="none" stroke-width="1.5"/><text x="140.0" y="85" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">序盤〜一章</text><rect x="30" y="108" width="220" height="130" rx="8" fill="#ffffff" stroke="#9aa5b0" stroke-width="1.5"/><text x="140.0" y="136" font-size="15" fill="#1b2129" text-anchor="middle" font-weight="bold">入口だけ試す</text><text x="140.0" y="164" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">5 つの木の 1 行目</text><text x="140.0" y="184" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">（段 3 まで、刻印なし）</text><text x="140.0" y="204" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">＋ 旅人の 1 行目</text><polygon points="268,164 254,154 254,174" fill="#9aa5b0"/><rect x="270" y="60" width="220" height="40" rx="8" fill="#0a8fa6" stroke="none" stroke-width="1.5"/><text x="380.0" y="85" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">一章の最後（Lv 12〜15）</text><rect x="270" y="108" width="220" height="130" rx="8" fill="#ffffff" stroke="#9aa5b0" stroke-width="1.5"/><text x="380.0" y="136" font-size="15" fill="#1b2129" text-anchor="middle" font-weight="bold">天職を選ぶ</text><text x="380.0" y="164" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">心臓が止まり巨神が眠る場面のあと。</text><text x="380.0" y="184" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">天性が付き、選んだ木が全部開く。</text><text x="380.0" y="204" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">他の木の技は段 2 まで残る</text><polygon points="508,164 494,154 494,174" fill="#9aa5b0"/><rect x="510" y="60" width="220" height="40" rx="8" fill="#0a8fa6" stroke="none" stroke-width="1.5"/><text x="620.0" y="85" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">三章（雷翼のあと）</text><rect x="510" y="108" width="220" height="130" rx="8" fill="#ffffff" stroke="#9aa5b0" stroke-width="1.5"/><text x="620.0" y="136" font-size="15" fill="#1b2129" text-anchor="middle" font-weight="bold">2 つ目の天職</text><text x="620.0" y="164" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">別の木を 3 行目まで。</text><text x="620.0" y="184" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">要と天性はなし。</text><text x="620.0" y="204" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">5 つ目の枠も開く</text><text x="380" y="280" font-size="14" fill="#1b2129" text-anchor="middle" font-weight="bold">木の開き方</text><text x="180" y="306" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">岩守り</text><text x="298" y="306" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">風読み</text><text x="416" y="306" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">潮歌い</text><text x="534" y="306" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">灰の鍛え人</text><text x="652" y="306" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">骨の射手</text><text x="110" y="346" font-size="12" fill="#5b6672" text-anchor="end" font-weight="normal">序盤〜一章</text><rect x="130" y="348" width="100" height="14" rx="4" fill="#a0693a" stroke="none" stroke-width="1.5" opacity="0.35"/><rect x="248" y="348" width="100" height="14" rx="4" fill="#2f8fb8" stroke="none" stroke-width="1.5" opacity="0.35"/><rect x="366" y="348" width="100" height="14" rx="4" fill="#2aa198" stroke="none" stroke-width="1.5" opacity="0.35"/><rect x="484" y="348" width="100" height="14" rx="4" fill="#c0502d" stroke="none" stroke-width="1.5" opacity="0.35"/><rect x="602" y="348" width="100" height="14" rx="4" fill="#6b6fb8" stroke="none" stroke-width="1.5" opacity="0.35"/><text x="110" y="408" font-size="12" fill="#5b6672" text-anchor="end" font-weight="normal">天職のあと</text><rect x="130" y="378" width="100" height="46" rx="4" fill="#a0693a" stroke="none" stroke-width="1.5" opacity="1"/><rect x="248" y="410" width="100" height="14" rx="4" fill="#2f8fb8" stroke="none" stroke-width="1.5" opacity="0.35"/><rect x="366" y="410" width="100" height="14" rx="4" fill="#2aa198" stroke="none" stroke-width="1.5" opacity="0.35"/><rect x="484" y="410" width="100" height="14" rx="4" fill="#c0502d" stroke="none" stroke-width="1.5" opacity="0.35"/><rect x="602" y="410" width="100" height="14" rx="4" fill="#6b6fb8" stroke="none" stroke-width="1.5" opacity="0.35"/><text x="110" y="470" font-size="12" fill="#5b6672" text-anchor="end" font-weight="normal">2 つ目のあと</text><rect x="130" y="440" width="100" height="46" rx="4" fill="#a0693a" stroke="none" stroke-width="1.5" opacity="1"/><rect x="248" y="472" width="100" height="14" rx="4" fill="#2f8fb8" stroke="none" stroke-width="1.5" opacity="0.35"/><rect x="366" y="452" width="100" height="34" rx="4" fill="#2aa198" stroke="none" stroke-width="1.5" opacity="0.75"/><rect x="484" y="472" width="100" height="14" rx="4" fill="#c0502d" stroke="none" stroke-width="1.5" opacity="0.35"/><rect x="602" y="472" width="100" height="14" rx="4" fill="#6b6fb8" stroke="none" stroke-width="1.5" opacity="0.35"/><text x="380" y="520" font-size="12" fill="#5b6672" text-anchor="middle" font-weight="normal">二つの状態（天職の前と後）が要る。技 36 ＋ 天性 5 ＝ 41。A の上に載せる作り</text><text x="380" y="540" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal">濃い塗りは全部開いた木、中間は 3 行目まで、薄い塗りは 1 行目のみ（例: 岩守りが天職、潮歌いが 2 つ目）</text></svg>