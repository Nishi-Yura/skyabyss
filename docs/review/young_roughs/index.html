<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>巨神の子 選定</title>
<style>
:root{
  --bg:#eceef0; --panel:#f8f9fa; --ink:#1b2129; --muted:#5b6672; --line:#c9d0d6;
  --accent:#0a8fa6; --accent-ink:#ffffff; --ok:#2f8a4b; --shot:#14141c;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#171b22; --ink:#e3e8ee; --muted:#93a0ad; --line:#2a313b;
  --accent:#5fdcef; --accent-ink:#0b1216; --ok:#6fd18c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#171b22; --ink:#e3e8ee; --muted:#93a0ad; --line:#2a313b;
  --accent:#5fdcef; --accent-ink:#0b1216; --ok:#6fd18c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}
h1{font-weight:700;font-size:clamp(24px,4vw,34px);margin:0 0 8px;letter-spacing:.03em;text-wrap:balance}
h2{font-size:19px;margin:34px 0 10px}
.intro{color:var(--muted);max-width:70ch;margin:0 0 6px}
figure{margin:0}
img{display:block;width:100%;height:auto;background:var(--shot);border:1px solid var(--line);image-rendering:pixelated}
.option{background:var(--panel);border:1px solid var(--line);padding:14px;margin:16px 0}
.option h3{margin:0 0 4px;font-size:18px}
.option p{margin:0 0 10px;color:var(--muted)}
.option figure + figure{margin-top:8px}
figcaption{font-size:12px;color:var(--muted);margin-top:2px}
.scroll{overflow-x:auto}
.scroll img{min-width:720px}
.sec{margin-top:44px;padding-top:6px;border-top:2px solid var(--line)}
.opts{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.letter{font-size:22px;font-weight:700;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.opt:has(input:checked){border-color:var(--accent)}
.opt:has(input:checked) .letter{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.note{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 10px;resize:vertical}
.note:focus{outline:2px solid var(--accent)}
.note-l{font-size:13px;color:var(--muted);display:block;margin:14px 0 4px}
.save{color:var(--muted);font-size:13px;margin-top:6px}
@media (max-width:760px){ .opts{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <h1>巨神の子（歌のかけら）の形</h1>
  <p class="intro">巨神ごとの「子」は、笛で現れてパーティ全員（最大 6 人）を運び、降りると歌に溶けます。四体とも低ポリ＋1 ブロック 32 画素のドット絵で、骨とアニメは 3 案共通です（どれを選んでも動きは同じ）。人の影は灰色の箱で示しています。今は仮に A 案をゲームに入れてあります。巨神ごとに 1 案を選び、直してほしい点があれば書いてください。</p>
  <div id="all"></div>
  <div class="save" id="save">読み込み中…</div>
</div>
<script>
(() => {
  const TITANS = [["stone_whale", "岩鯨の仔"], ["tide_shell", "潮殻の稚貝"], ["thunder_wing", "雷翼の雛"], ["ember", "余燼の仔"]];
  const DATA = {"stone_whale": {"title": "岩鯨の仔", "a": {"title": "A 骨の輿", "desc": "いちばん丸くふっくらした石の仔鯨。背の板張りの台を、わき腹から立つ鯨骨の肋が両側から囲む輿にした。肋の先と額に青緑の歌のかけらが灯り、左わきに親ゆずりの小さな錨石が揺れる。"}, "b": {"title": "B 背びれの鞍", "desc": "細身で、頭とわき腹に石の板を重ねた仔鯨。両わきから立つ二枚の大きな鯨骨の背びれが鞍の壁と背もたれになり、稜線に青緑の光の筋が走る。長い胸びれで翼のように空をかく。"}, "c": {"title": "C 藤壺の椀", "desc": "まんまるの仔鯨が、帆立の縁の半分の貝殻を椀にして背負う。椀の中が 6 人の床で、外は藤壺だらけ、いくつかの藤壺の口が青緑に光る。椀の前の縁から鎖と小さな錨石が垂れる。"}}, "tide_shell": {"title": "潮殻の稚貝 (ちがい)", "a": {"title": "A 平背の子亀", "desc": "成体の潮殻をそのまま縮めた子海亀。低く広い青緑の甲羅が浅い鉢になり、底の平らな鱗板が 6 人の腰掛け、縁の頂を真珠の粒を連ねた桃色の帯が囲む。大きな前ひれ 2 枚で水をかき、額の真珠層の杯に歌のかけらが灯る。"}, "b": {"title": "B 巻き殻の稚貝", "desc": "生まれたての鸚鵡貝。後ろに虎縞の大きな巻き殻が立ち、前を向いた殻口が 3 列目の背もたれになる。殻口から前へ開いた体の部屋の床が真珠層の甲板。前は頭巾と触手の冠、横に大きな目で、頭巾の先に歌のかけらが灯る。"}, "c": {"title": "C 開き貝の稚貝", "desc": "平たい底の扇貝。下の殻が丸い舟、上の殻は後ろの蝶番から扇のように立って背もたれになる。殻の間からはみ出す青い外套膜の縁に光る小さな目の粒が並び、甲板の左右に珊瑚の手すり、前の唇に大きな真珠 (歌のかけら)。"}}, "thunder_wing": {"title": "雷翼の雛", "a": {"title": "A 産毛の雛", "desc": "灰青の産毛でふくらんだ丸い雛。生えかけの翼に、金に光る雷の羽軸が数本だけ混じる。背は白い産毛の座布団の鞍で、縁を立てた羽根の柵と産毛の枕が囲む。いちばん「雛」らしく、やわらかい。"}, "b": {"title": "B 若い猛禽", "desc": "細身の若い猛禽。長い初列風切を指のように開き、翼の上を稲妻の筋が走る。背は骨の肋で腹へ締めた白い骨の鞍台で、羽軸の手すりと銅の柱がつく。頭に成体と同じ銅の避雷針の冠。いちばん速く、成体に近い。"}, "c": {"title": "C 雷の輪の雛", "desc": "ずんぐり丸い雛で、翼は短い。腹のまわりに浮かぶ雷の輪 (青白く光る輪・稲妻の歯・銅の節) が体を運ぶ。背は産毛の巣の鞍で、ふくらんだ縁が丸く囲む。額に光る稲妻の巻き毛。遠目に輪で見分けがつく。"}}, "ember": {"title": "余燼の仔", "a": {"title": "A 燠石の仔熊", "desc": "ずんぐりした黒い玄武岩の仔熊。首の骨の鞍が背骨に沿って伸び、肋骨の板を並べた長椅子になって両脇の肋骨が胴を抱く。肩の瘤で頭を高く持ち上げ、腰には親の火山を縮めた小さな火口。胸の核が歌のかけらとして光る。"}, "b": {"title": "B 灰板の火蜥蜴", "desc": "親の「皮が岩になる火蜥蜴」をいちばんそのまま縮めた、低く長い火蜥蜴の仔。脚は横へ張り出し、尾は横へ巻く。背の両脇に黒い殻の板が並び、そのあいだに灰色の平たい石の板が鞍として載る。額の燠の結晶の冠と胸の核が光る。"}, "c": {"title": "C 燠結晶の岩亀", "desc": "丸い岩の塊のような亀の仔。甲羅は黒い殻の板と玄武岩の帯で、上は平らに削れた石の台地になり、ふちを燠の結晶がぐるりと囲む。柱の脚でのしのし歩く。甲羅の前のふちに歌のかけらの核が埋まる。"}}};
  const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const root = document.getElementById('all');
  const saveEl = document.getElementById('save');
  let db = null; const timers = {};
  const FILE = {stone_whale: 'stone_whale', tide_shell: 'tide_shell', thunder_wing: 'thunder_wing', ember: 'ember'};
  for (const [t, name] of TITANS) {
    const sec = mk('section', 'sec');
    sec.appendChild(mk('h2', '', name + '（' + t + '）'));
    sec.appendChild(mk('figure', 'scroll', `<img src="${FILE[t]}_compare.png" alt="${name} 3 案の並び" loading="lazy"><figcaption>3 案の前 3/4</figcaption>`));
    for (const k of ['a', 'b', 'c']) {
      const o = mk('div', 'option');
      o.appendChild(mk('h3', '', DATA[t][k].title));
      o.appendChild(mk('p', '', DATA[t][k].desc));
      o.appendChild(mk('figure', 'scroll', `<img src="${FILE[t]}_${k}.png" alt="${DATA[t][k].title} 8 方向・人を乗せた図・動き" loading="lazy"><figcaption>8 方向・乗せた図・動き</figcaption>`));
      sec.appendChild(o);
    }
    const fs = mk('fieldset', 'opts');
    for (const k of ['a', 'b', 'c']) {
      fs.appendChild(mk('label', 'opt', `<input type="radio" name="style_${t}" value="${k}"><span class="letter">${k.toUpperCase()}</span><span>${DATA[t][k].title.replace(/^[A-C] /, '')}</span>`));
    }
    sec.appendChild(fs);
    sec.appendChild(mk('label', 'note-l', '直してほしい点（任意）')).setAttribute('for', 'note_' + t);
    const ta = mk('textarea', 'note'); ta.id = 'note_' + t; ta.rows = 2;
    sec.appendChild(ta);
    root.appendChild(sec);
    const chosen = () => { const r = sec.querySelector('input[name=style_' + t + ']:checked'); return r ? r.value : ''; };
    const save = async () => {
      if (!db) return;
      saveEl.textContent = '保存中…';
      try { await db.doc('choices/young_look_' + t).set({ option: chosen(), note: ta.value, at: Date.now() }); saveEl.textContent = '保存しました'; }
      catch (e) { saveEl.textContent = '保存できませんでした。もう一度選び直してください'; }
    };
    sec.querySelectorAll('input').forEach(r => r.addEventListener('change', save));
    ta.addEventListener('input', () => { clearTimeout(timers[t]); timers[t] = setTimeout(save, 800); });
  }
  (async () => {
    const c = window.claude && window.claude.use ? window.claude : null;
    db = c ? await c.use('db') : null;
    if (!db) { saveEl.textContent = 'この表示では選択を保存できません (サインインして開いてください)'; return; }
    try {
      const snap = await db.collection('choices').get();
      for (const d of (snap.docs || snap)) {
        const m = /^young_look_(.+)$/.exec(d.id); if (!m) continue;
        const data = typeof d.data === 'function' ? d.data() : d.data; if (!data) continue;
        if (data.option) { const r = document.querySelector(`input[name=style_${m[1]}][value="${data.option}"]`); if (r) r.checked = true; }
        if (data.note) { const n = document.getElementById('note_' + m[1]); if (n) n.value = data.note; }
      }
      saveEl.textContent = '選ぶと自動で保存されます';
    } catch (e) { saveEl.textContent = '前回の選択を読み込めませんでした'; }
  })();
})();
</script>
</body>
</html>
