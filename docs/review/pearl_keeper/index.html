<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>真珠守り 選定</title>
<style>
:root{
  --bg:#eceef0; --panel:#f8f9fa; --ink:#1b2129; --muted:#5b6672; --line:#c9d0d6;
  --accent:#0a8fa6; --accent-ink:#ffffff; --ok:#2f8a4b; --shot:#14141c;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#171b22; --ink:#e3e8ee; --muted:#93a0ad; --line:#2a313b;
  --accent:#5fdcef; --accent-ink:#0b1216; --ok:#6fd18c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#171b22; --ink:#e3e8ee; --muted:#93a0ad; --line:#2a313b;
  --accent:#5fdcef; --accent-ink:#0b1216; --ok:#6fd18c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}
h1{font-weight:700;font-size:clamp(24px,4vw,34px);margin:0 0 8px;letter-spacing:.03em;text-wrap:balance}
h2{font-size:19px;margin:34px 0 10px}
.intro{color:var(--muted);max-width:70ch;margin:0 0 6px}
figure{margin:0}
img{display:block;width:100%;height:auto;background:var(--shot);border:1px solid var(--line);image-rendering:pixelated}
.option{background:var(--panel);border:1px solid var(--line);padding:14px;margin:16px 0}
.option h3{margin:0 0 4px;font-size:18px}
.option p{margin:0 0 10px;color:var(--muted)}
.option figure + figure{margin-top:8px}
figcaption{font-size:12px;color:var(--muted);margin-top:2px}
.scroll{overflow-x:auto}
.scroll img{min-width:720px}
.opts{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.letter{font-size:22px;font-weight:700;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.opt:has(input:checked){border-color:var(--accent)}
.opt:has(input:checked) .letter{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.note{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 10px;resize:vertical}
.note:focus{outline:2px solid var(--accent)}
.note-l{font-size:13px;color:var(--muted);display:block;margin:14px 0 4px}
.save{color:var(--muted);font-size:13px;margin-top:6px}
@media (max-width:760px){ .opts{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <h1>真珠守り（名づきの番）の形</h1>
  <p class="intro">潮殻の背の「息の間」の頂で戦う、大きな宿借りです。貝殻に籠もり、息を吐く技（吹き上げ・吹き下ろし）を使い、真珠の礫を吐き、殻に籠もって転がって突進します。弱点は光る大きな真珠です。3 案とも低ポリ＋1 ブロック 32 画素のドット絵で、大きさは幅 3 × 高さ 3.4 ブロック。骨とアニメは 3 案共通なので、どれを選んでも同じ動きになります。今は仮に A 案をゲームに入れてあります。</p>
  <figure><img src="compare.png" alt="3 案の前 3/4 の並び" loading="lazy"><figcaption>3 案の並び（前 3/4）</figcaption></figure>
  <div id="options"></div>

  <h2>採用する案</h2>
  <fieldset class="opts" id="opts"></fieldset>
  <label class="note-l" for="note">直してほしい点（任意。色・殻の形・真珠の位置・はさみの大きさ、など）</label>
  <textarea id="note" class="note" rows="3" placeholder="例: A の殻に C の珊瑚を足す、真珠をもっと大きく"></textarea>
  <div class="save" id="save">読み込み中…</div>
</div>
<script>
(() => {
  const OPTS = {
    "a": {"title": "A 螺旋の宿", "desc": "真珠層の白い巻貝（青緑の螺旋の帯、鮑のような息の穴の列）を背負う珊瑚色の宿借り。殻の肩の花びらの台に大きな真珠。右の大きいはさみ。いちばん宿借りらしい形。"},
    "b": {"title": "B 畝の塔", "desc": "細く高い塔の巻貝（青緑に白い畝と棘）を立てて背負う、脚の長い深い青の宿借り。真珠は殻の正面の白い肋の籠に埋まる。縦に高く、遠くからも塔で見分けがつく。"},
    "c": {"title": "C 珊瑚の兜", "desc": "低く広い円い殻（青緑の石灰に真珠層の螺旋の筋）に珊瑚の林が生え、頂の開いた二枚貝に真珠。下から白い宿借りが覗き、平たい盾のはさみで顔を守る。横に広く重い。"}
  };
  const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const box = document.getElementById('options');
  const opts = document.getElementById('opts');
  for (const k of Object.keys(OPTS)) {
    const o = mk('section', 'option');
    o.appendChild(mk('h3', '', OPTS[k].title));
    o.appendChild(mk('p', '', OPTS[k].desc));
    o.appendChild(mk('figure', 'scroll', `<img src="opt_${k}_views.png" alt="${OPTS[k].title} 前・後ろ・横・遠く" loading="lazy"><figcaption>前 3/4・後ろ 3/4・横・遠く（約 15 ブロック）</figcaption>`));
    o.appendChild(mk('figure', 'scroll', `<img src="opt_${k}_actions.png" alt="${OPTS[k].title} 技の構え" loading="lazy"><figcaption>籠もる・吹き上げの溜め・吹き下ろしの溜め・真珠の礫・突進の転がり</figcaption>`));
    box.appendChild(o);
    opts.appendChild(mk('label', 'opt', `<input type="radio" name="style" value="${k}"><span class="letter">${k.toUpperCase()}</span><span>${OPTS[k].title}</span>`));
  }

  const saveEl = document.getElementById('save');
  const note = document.getElementById('note');
  let db = null, timer = null;
  const chosen = () => { const r = document.querySelector('input[name=style]:checked'); return r ? r.value : ''; };
  async function save() {
    if (!db) return;
    saveEl.textContent = '保存中…';
    try {
      await db.doc('choices/pearl_keeper').set({ option: chosen(), note: note.value, at: Date.now() });
      saveEl.textContent = '保存しました';
    } catch (e) { saveEl.textContent = '保存できませんでした。もう一度選び直してください'; }
  }
  document.querySelectorAll('input[name=style]').forEach(r => r.addEventListener('change', save));
  note.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(save, 800); });
  (async () => {
    const c = window.claude && window.claude.use ? window.claude : null;
    db = c ? await c.use('db') : null;
    if (!db) { saveEl.textContent = 'この表示では選択を保存できません (サインインして開いてください)'; return; }
    try {
      const snap = await db.collection('choices').get();
      const docs = snap.docs || snap;
      for (const d of docs) {
        if (d.id !== 'pearl_keeper') continue;
        const data = typeof d.data === 'function' ? d.data() : d.data;
        if (!data) continue;
        if (data.option) { const r = document.querySelector(`input[name=style][value="${data.option}"]`); if (r) r.checked = true; }
        if (data.note) note.value = data.note;
      }
      saveEl.textContent = '選ぶと自動で保存されます';
    } catch (e) { saveEl.textContent = '前回の選択を読み込めませんでした'; }
  })();
})();
</script>
</body>
</html>
