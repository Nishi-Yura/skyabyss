<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灯の絵 選定</title>
<style>
:root{
  --bg:#eceef0; --panel:#f8f9fa; --ink:#1b2129; --muted:#5b6672; --line:#c9d0d6;
  --accent:#0a8fa6; --accent-ink:#ffffff;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#171b22; --ink:#e3e8ee; --muted:#93a0ad; --line:#2a313b;
  --accent:#5fdcef; --accent-ink:#0b1216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#171b22; --ink:#e3e8ee; --muted:#93a0ad; --line:#2a313b;
  --accent:#5fdcef; --accent-ink:#0b1216; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}
h1{font-weight:700;font-size:clamp(24px,4vw,34px);margin:0 0 8px;letter-spacing:.03em;text-wrap:balance}
h2{font-size:19px;margin:34px 0 10px}
.intro{color:var(--muted);max-width:70ch;margin:0 0 6px}
.sheet{display:block;width:100%;height:auto;border:1px solid var(--line);image-rendering:pixelated;margin:16px 0;background:#161c22}
.opts{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt img{width:64px;height:64px;image-rendering:pixelated;flex:none;background:#162a38}
.letter{font-size:22px;font-weight:700;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.opt:has(input:checked){border-color:var(--accent)}
.opt:has(input:checked) .letter{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.note{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 10px;resize:vertical}
.note:focus{outline:2px solid var(--accent)}
.note-l{font-size:13px;color:var(--muted);display:block;margin:14px 0 4px}
.save{color:var(--muted);font-size:13px;margin-top:6px}
@media (max-width:760px){.opts{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>光る海のイソギンチャクの絵</h1>
  <p class="intro">岩鯨の下の試練 (闇の水路) で持ち運ぶ「灯」の品のアイコンと、それを置く「灯の台」ブロックの表面の、それぞれ 3 案です。どちらも 32×32 のドット絵。ゲームには、いまは両方とも A が入っています。選んだ案は、次の作業で入れ替えます。台の「前から見た図」は、台の形に表面を貼った雰囲気の確認用の簡単な絵で、実際のモデルとは細部が違います。</p>
  <img class="sheet" src="sheet.png" alt="3 案の並び: 上段が品のアイコン、中段が台の表面、下段が台の前から見た図 (灯る前と灯った後)">

  <h2>品のアイコン</h2>
  <fieldset class="opts" id="item_opts"></fieldset>
  <label class="note-l" for="item_note">直してほしい点 (任意)</label>
  <textarea id="item_note" class="note" rows="2" placeholder="例: Bの瓶で、触手をもう少し太く"></textarea>
  <div class="save" id="item_save">読み込み中…</div>

  <h2>灯の台の表面</h2>
  <fieldset class="opts" id="ped_opts"></fieldset>
  <label class="note-l" for="ped_note">直してほしい点 (任意)</label>
  <textarea id="ped_note" class="note" rows="2" placeholder="例: Aの溝を、灯ったとき光る色に"></textarea>
  <div class="save" id="ped_save">読み込み中…</div>
</div>
<script>
(() => {
  const ITEM = {
    a: ['A 素のイソギンチャク', '石の根もとから触手が広がる。いちばん素直で、水の中でも形が読める', 'item_a.png'],
    b: ['B 石栓の瓶', '小さな瓶に入れた灯。持ち歩く提灯らしさが出る。手に持つと輪郭がはっきりする', 'item_b.png'],
    c: ['C 吊るした鐘', 'くらげ風の鐘形に骨の輪。ぶら下がる灯。ほかの品より少し目立つ', 'item_c.png']
  };
  const PED = {
    a: ['A 深層岩の石柱', '青灰の石に青緑の溝が一本。岩鯨の背の石と同じ色で、馴染む', 'pedestal_a.png'],
    b: ['B 鯨骨の杯', '骨の白に錆の帯。暗い水の中でいちばん見つけやすい', 'pedestal_b.png'],
    c: ['C 貝と珊瑚の籠', '紫がかった青の石にさざ波と小さな光る貝。水路らしい', 'pedestal_c.png']
  };
  const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  function fill(id, name, table) {
    const box = document.getElementById(id);
    for (const k of Object.keys(table)) {
      const [t, d, img] = table[k];
      box.appendChild(mk('label', 'opt', `<input type="radio" name="${name}" value="${k}"><span class="letter">${k.toUpperCase()}</span><img src="${img}" alt=""><span>${t}<small>${d}</small></span>`));
    }
  }
  fill('item_opts', 'item', ITEM);
  fill('ped_opts', 'ped', PED);

  const parts = [
    { name: 'item', doc: 'anemone_item', note: document.getElementById('item_note'), saveEl: document.getElementById('item_save') },
    { name: 'ped', doc: 'anemone_pedestal', note: document.getElementById('ped_note'), saveEl: document.getElementById('ped_save') }
  ];
  let db = null;
  const chosen = p => { const r = document.querySelector(`input[name=${p.name}]:checked`); return r ? r.value : ''; };
  async function save(p) {
    if (!db) return;
    p.saveEl.textContent = '保存中…';
    try {
      await db.doc('choices/' + p.doc).set({ option: chosen(p), note: p.note.value, at: Date.now() });
      p.saveEl.textContent = '保存しました';
    } catch (e) { p.saveEl.textContent = '保存できませんでした。もう一度選び直してください'; }
  }
  for (const p of parts) {
    document.querySelectorAll(`input[name=${p.name}]`).forEach(r => r.addEventListener('change', () => save(p)));
    let timer = null;
    p.note.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => save(p), 800); });
  }
  (async () => {
    const c = window.claude && window.claude.use ? window.claude : null;
    db = c ? await c.use('db') : null;
    if (!db) { parts.forEach(p => p.saveEl.textContent = 'この表示では選択を保存できません (サインインして開いてください)'); return; }
    try {
      const snap = await db.collection('choices').get();
      const docs = snap.docs || snap;
      for (const d of docs) {
        const p = parts.find(x => x.doc === d.id);
        if (!p) continue;
        const data = typeof d.data === 'function' ? d.data() : d.data;
        if (!data) continue;
        if (data.option) { const r = document.querySelector(`input[name=${p.name}][value="${data.option}"]`); if (r) r.checked = true; }
        if (data.note) p.note.value = data.note;
      }
      parts.forEach(p => p.saveEl.textContent = '選ぶと自動で保存されます');
    } catch (e) { parts.forEach(p => p.saveEl.textContent = '前回の選択を読み込めませんでした'); }
  })();
})();
</script>
</body>
</html>
